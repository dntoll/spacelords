name: CI
run-name: Quick checks main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  quality:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-checks
          path: |
            dist/checks/
            test-results/
